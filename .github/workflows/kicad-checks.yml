name: KiCad Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'
      - 'feature/**'

jobs:
  kicad-checks:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
      # Match the hosted runner UID so actions can write runner command/state files.
      options: --user 1001
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Verify KiCad environment
        run: scripts/verify-environment.sh --report-dir artifacts/verify-environment

      - name: Run known-good fixture checks
        run: |
          scripts/check-design.sh \
            --project fixtures/kicad9-known-good/mr_diagrams_small_parts.kicad_pro \
            --reports-dir artifacts/known-good

      - name: Export known-good fixture fabrication data
        run: |
          scripts/export-fabrication.sh \
            --project fixtures/kicad9-known-good/mr_diagrams_small_parts.kicad_pro \
            --out-dir artifacts/known-good-fabrication

      - name: Check active design when available
        id: active_checks
        shell: bash
        run: |
          set +e
          scripts/check-design.sh --reports-dir artifacts/check-design
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [[ $rc -eq 0 ]]; then
            echo "Headless design checks passed."
          elif [[ $rc -eq 4 ]]; then
            echo "Legacy format detected; headless ERC/DRC skipped with actionable logs."
          else
            exit $rc
          fi

      - name: Verify deliberate invalid fixture (legacy format)
        shell: bash
        run: |
          set +e
          scripts/check-design.sh --project ./2021_QYT_Rec_interface.pro --reports-dir artifacts/invalid-fixture
          rc=$?
          set -e
          if [[ $rc -eq 4 ]]; then
            echo "Legacy fixture correctly produced nonzero exit ($rc)."
          else
            echo "Expected legacy fixture to fail with exit 4, got $rc" >&2
            exit 1
          fi

      - name: Export fabrication outputs when modern project passes
        if: steps.active_checks.outputs.exit_code == '0'
        run: scripts/export-fabrication.sh --out-dir artifacts/fabrication

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-check-artifacts
          path: artifacts/
